version: 2

# The commit-message prefixes are not cosmetic. Dependabot's default title
# ("Bump serde from 1.0.1 to 1.0.2") is not a conventional commit, so it would
# fail the PR title check and, if merged anyway, produce no release.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      # A dependency update changes the shipped binary, so it earns a patch
      # release. Use chore(deps) instead if that turns out to be too noisy.
      prefix: fix(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # Nothing here reaches the binary, so these must not trigger a release.
      prefix: ci(deps)
