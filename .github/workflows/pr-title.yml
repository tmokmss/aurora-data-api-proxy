name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: conventional commit
    runs-on: ubuntu-22.04
    steps:
      # Squash-merging turns the pull request title into the commit message on
      # main, and that message is the only thing that decides whether a release
      # happens and what it is numbered. A title semantic-release cannot parse
      # produces no release and no error, so the check belongs here, before the
      # merge, rather than being discovered by its silence afterwards.
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # feat -> minor, fix and perf -> patch, everything else -> no release.
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
