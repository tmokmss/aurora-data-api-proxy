[package]
name = "aurora-data-api-proxy"
version = "0.1.0"
edition = "2024"
description = "Speak the PostgreSQL wire protocol to an Aurora cluster over the RDS Data API, so ordinary clients and drivers can reach it with IAM alone."
license = "MIT"
repository = "https://github.com/tmokmss/aurora-data-api-proxy"
readme = "README.md"
keywords = ["postgres", "aurora", "aws", "rds-data-api", "proxy"]
categories = ["database", "command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
aws-config = "1.12.0"
aws-sdk-rdsdata = "1.114.0"
aws-smithy-types = "1.6.4"
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
pgwire = "0.41.0"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tokio-postgres = "0.7.18"
