name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run has nothing left to tell us.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: rustfmt + clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every platform a release ships a binary for, so nothing is
        # distributed untested. macOS is arm64 and covers both Apple targets;
        # x86_64-apple-darwin is cross-compiled from it at release time.
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # This runs the unit tests only. The integration tests in
      # tests/tokio_postgres.rs skip themselves unless CLUSTER_ARN, SECRET_ARN
      # and DATABASE point at a real cluster, and the client suites under
      # tests/clients/ need one too, so COMPATIBILITY.md stays a document of
      # results verified by hand rather than anything CI can prove.
      - run: cargo test --locked
