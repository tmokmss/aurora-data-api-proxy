name: RTT probe

# Temporary: measures where a GitHub-hosted runner sits relative to the AWS
# regional endpoints, so docs/benchmark.md can quote a measured round trip from
# a US host instead of extrapolating from one taken across the Pacific.
# Delete once the numbers are recorded.

on:
  push:
    branches: ['bench/**']

permissions: {}

jobs:
  rtt:
    name: round trips from a hosted runner
    runs-on: ubuntu-22.04
    steps:
      - name: where the runner is
        run: |
          echo "public address:"
          curl -s https://checkip.amazonaws.com
          echo "geo:"
          curl -s https://ipinfo.io/json || echo "(ipinfo unavailable)"

      - name: round trips to the rds-data endpoints
        run: |
          for region in us-east-1 us-east-2 us-west-2 eu-west-1 ap-northeast-1; do
            echo "## $region"
            for _ in 1 2 3 4 5; do
              curl -s -o /dev/null -X POST \
                -H 'Content-Type: application/json' -d '{}' \
                -w '%{time_namelookup} %{time_connect} %{time_appconnect} %{time_starttransfer} %{http_code}\n' \
                "https://rds-data.$region.amazonaws.com/Execute"
            done | awk '{
                tcp = ($2 - $1) * 1000
                req = ($4 - $3) * 1000
                printf "  tcp_rtt %7.2f ms   request %7.2f ms   http %s\n", tcp, req, $5
                if (mt == 0 || tcp < mt) mt = tcp
                if (mr == 0 || req < mr) mr = req
              }
              END { printf "  -> min tcp_rtt %.2f ms, min request %.2f ms\n\n", mt, mr }'
          done
